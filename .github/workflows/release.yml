name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "ver=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          zip -r "ipr-translation-data-en-${{ steps.ver.outputs.ver }}.zip" version.txt local-files

      - name: Check existing release (idempotency guard)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${{ steps.ver.outputs.ver }} already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Automatic Release
        if: steps.guard.outputs.skip != 'true'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ steps.ver.outputs.ver }}
          title: Release ${{ steps.ver.outputs.ver }}
          prerelease: false
          files: ipr-translation-data-en-${{ steps.ver.outputs.ver }}.zip
